# Pipeline probado en proyecto propio y luego traido a este proyecto

trigger:
- main

resources:
- repo: self

variables:
  
  dockerRegistryServiceConnection: 'container-inventario'

  # 👉 Cambiar si quieres otro nombre para la imagen
  imageRepository: 'nuevo-microservicio'

  # 👉 Tu Azure Container Registry
  containerRegistry: 'backendconteiner.azurecr.io'

  # 👉 Ruta del Dockerfile (editar si está en otra carpeta)
  dockerfilePath: '$(Build.SourcesDirectory)/dockerfile'

  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:

- stage: Build
  displayName: Build and Scan
  jobs:
  - job: Build
    pool:
      vmImage: $(vmImageName)
    steps:

    # 1 --- Install Grype
    - script: |
        echo "Installing Grype..."
        curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
        grype --version
      displayName: "Install Grype"

    # 2 --- Scan directory/project
    - script: |
        echo "Scanning project..."
        grype dir:.
      displayName: "Grype Scan - Source"

    # 3 --- Build DOCKER IMAGE LOCALLY
    - task: Docker@2
      displayName: "Build Local Docker Image"
      inputs:
        command: build
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

    # 4 --- Scan the LOCAL image
    - script: |
        echo "Scanning Docker image locally..."
        docker images
        echo "Image to scan: $(containerRegistry)/$(imageRepository):$(tag)"
        grype $(containerRegistry)/$(imageRepository):$(tag)
      displayName: "Grype Scan - Docker Image"

    # 5 --- Push ONLY if Grype passes
    - task: Docker@2
      displayName: "Push Image (only if safe)"
      condition: succeeded()
      inputs:
        command: push
        repository: $(imageRepository)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
