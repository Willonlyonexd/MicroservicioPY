trigger:
- main

resources:
- repo: self

variables:
  # Conexión y repositorio para ACR
  dockerRegistryServiceConnectionACR: 'Container Images Diplomado M3'
  imageRepositoryACR: 'nuevo-microservicio'
  containerRegistryACR: 'backendconteiner.azurecr.io'

  # Conexión y repositorio para Docker Hub
  dockerRegistryServiceConnectionDockerHub: 'DockerHubConnection'
  imageRepositoryDockerHub: 'wilsonmontanoclaros/microservicio-python'
  containerRegistryDockerHub: 'docker.io'

  dockerfilePath: '$(Build.SourcesDirectory)/dockerfile'
  tag: '1.0'
  vmImageName: 'ubuntu-latest'

stages:

- stage: Construccion
  displayName: "Construcción y Seguridad"
  jobs:

  # --- Job 1: Instalación y verificación de Grype ---
  - job: InstalarHerramientas
    displayName: "Instalar Grype"
    pool:
      vmImage: $(vmImageName)
    steps:
      - script: |
          echo "Instalando Grype..."
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype --version
        displayName: "Instalar y Verificar Grype"

  # --- Job 2: Escaneo de seguridad del código fuente ---
  - job: EscaneoCodigo
    displayName: "Escaneo de Código Fuente"
    dependsOn: InstalarHerramientas
    pool:
      vmImage: $(vmImageName)
    steps:
      - script: |
          echo "Instalando Grype..."
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype --version
        displayName: "Instalar Grype"

      - script: |
          echo "Escaneando código fuente del proyecto..."
          grype dir:.
        displayName: "Grype Scan - Código Fuente"

  # --- Job 3: Construcción y publicación en ACR ---
  - job: ConstruirYPublicarACR
    displayName: "Construir y Publicar Imagen en ACR"
    dependsOn: EscaneoCodigo
    pool:
      vmImage: $(vmImageName)
    steps:
      - script: |
          echo "Instalando Grype..."
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype --version
        displayName: "Instalar Grype"

      - task: Docker@2
        displayName: "Construir Imagen Docker Local"
        inputs:
          command: build
          repository: $(imageRepositoryACR)
          dockerfile: $(dockerfilePath)
          containerRegistry: $(dockerRegistryServiceConnectionACR)
          tags: |
            $(tag)

      - script: |
          echo "Escaneando imagen Docker local..."
          docker images
          IMAGE_ID=$(docker images --format "{{.ID}}" | head -n 1)
          echo "Usando Image ID: $IMAGE_ID"
          grype "docker:$IMAGE_ID"
        displayName: "Grype Scan - Imagen Docker"

      - task: Docker@2
        displayName: "Push Imagen a ACR"
        condition: succeeded()
        inputs:
          command: push
          repository: $(imageRepositoryACR)
          containerRegistry: $(dockerRegistryServiceConnectionACR)
          tags: |
            $(tag)

  # --- Job 4: Publicación en Docker Hub ---
  - job: PublicarDockerHub
    displayName: "Publicar Imagen en Docker Hub"
    dependsOn: ConstruirYPublicarACR
    pool:
      vmImage: $(vmImageName)
    steps:
      - task: Docker@2
        displayName: "Push Imagen a Docker Hub"
        inputs:
          command: push
          repository: $(imageRepositoryDockerHub)
          containerRegistry: $(dockerRegistryServiceConnectionDockerHub)
          tags: |
            $(tag)
