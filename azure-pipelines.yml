trigger:
- main

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: 'Container Images Diplomado M3'
  imageRepository: 'nuevo-microservicio'
  containerRegistry: 'backendconteiner.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:

- stage: Construccion
  displayName: "Construcción y Seguridad"
  jobs:

  # --- Job 1: Instalación y verificación de Grype ---
  - job: InstalarHerramientas
    displayName: "Instalar Grype"
    pool:
      vmImage: $(vmImageName)
    steps:
      - script: |
          echo "Instalando Grype..."
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype --version
        displayName: "Instalar y Verificar Grype"

  # --- Job 2: Escaneo de seguridad del código fuente ---
  - job: EscaneoCodigo
    displayName: "Escaneo de Código Fuente"
    dependsOn: InstalarHerramientas
    pool:
      vmImage: $(vmImageName)
    steps:
      - script: |
          echo "Instalando Grype..."
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype --version
        displayName: "Instalar Grype"

      - script: |
          echo "Escaneando código fuente del proyecto..."
          grype dir:.
        displayName: "Grype Scan - Código Fuente"

  # --- Job 3: Construcción y publicación de la imagen Docker ---
  - job: ConstruirYPublicar
    displayName: "Construir y Publicar Imagen Docker"
    dependsOn: EscaneoCodigo
    pool:
      vmImage: $(vmImageName)
    steps:
      - script: |
          echo "Instalando Grype..."
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype --version
        displayName: "Instalar Grype"

      - task: Docker@2
        displayName: "Construir Imagen Docker Local"
        inputs:
          command: build
          repository: $(imageRepository)
          dockerfile: $(dockerfilePath)
          containerRegistry: $(dockerRegistryServiceConnection)
          tags: |
            $(tag)

      - script: |
          echo "Escaneando imagen Docker local..."
          docker images
          IMAGE_ID=$(docker images --format "{{.ID}}" | head -n 1)
          echo "Usando Image ID: $IMAGE_ID"
          grype "docker:$IMAGE_ID"
        displayName: "Grype Scan - Imagen Docker"

      - task: Docker@2
        displayName: "Push Imagen (solo si pasa el escaneo)"
        condition: succeeded()
        inputs:
          command: push
          repository: $(imageRepository)
          containerRegistry: $(dockerRegistryServiceConnection)
          tags: |
            $(tag)
