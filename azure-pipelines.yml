trigger:
- main

resources:
- repo: self

variables:
  # ACR
  dockerRegistryServiceConnection: 'Container Images Diplomado M3'
  imageRepository: 'nuevo-microservicio'
  containerRegistry: 'backendconteiner.azurecr.io'

  # Docker Hub
  dockerRegistryServiceConnectionDockerHub: 'ServicioDockerHub'
  imageRepositoryDockerHub: 'wilsonmontanoclaros/microservicio-python'

  dockerfilePath: '$(Build.SourcesDirectory)/dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:

- stage: Construccion
  displayName: "Construcción y Seguridad"
  jobs:

  # --- Job 1: Instalación y verificación de Grype ---
  - job: InstalarHerramientas
    displayName: "Instalar Grype"
    pool:
      vmImage: $(vmImageName)
    steps:
      - script: |
          echo "Instalando Grype..."
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype --version
        displayName: "Instalar y Verificar Grype"

  # --- Job 2: Escaneo de seguridad del código fuente ---
  - job: EscaneoCodigo
    displayName: "Escaneo de Código Fuente"
    dependsOn: InstalarHerramientas
    pool:
      vmImage: $(vmImageName)
    steps:
      - script: |
          echo "Instalando Grype..."
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype --version
        displayName: "Instalar Grype"

      - script: |
          echo "Escaneando código fuente del proyecto..."
          grype dir:.
        displayName: "Grype Scan - Código Fuente"

  # --- Job 3: Construcción y publicación en ACR ---
  - job: ConstruirYPublicar
    displayName: "Construir y Publicar Imagen Docker en ACR"
    dependsOn: EscaneoCodigo
    pool:
      vmImage: $(vmImageName)
    steps:
      - script: |
          echo "Instalando Grype..."
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype --version
        displayName: "Instalar Grype"

      - task: Docker@2
        displayName: "Construir Imagen Docker Local"
        inputs:
          command: build
          repository: $(imageRepository)
          dockerfile: $(dockerfilePath)
          containerRegistry: $(dockerRegistryServiceConnection)
          tags: |
            $(tag)

      - script: |
          echo "Escaneando imagen Docker local..."
          docker images
          IMAGE_ID=$(docker images --format "{{.ID}}" | head -n 1)
          echo "Usando Image ID: $IMAGE_ID"
          grype "docker:$IMAGE_ID"
        displayName: "Grype Scan - Imagen Docker"

      - task: Docker@2
        displayName: "Push Imagen a ACR"
        condition: succeeded()
        inputs:
          command: push
          repository: $(imageRepository)
          containerRegistry: $(dockerRegistryServiceConnection)
          tags: |
            $(tag)

      # Exportar la imagen como TAR para compartirla con otros jobs
      - script: |
          echo "Exportando imagen como TAR..."
          docker save $(containerRegistry)/$(imageRepository):$(tag) -o image.tar
        displayName: "Exportar imagen como TAR"

      - publish: image.tar
        artifact: dockerImage

  # --- Job 4: Publicación en Docker Hub ---
  - job: PublicarDockerHub
    displayName: "Publicar Imagen en Docker Hub"
    dependsOn: ConstruirYPublicar
    pool:
      vmImage: $(vmImageName)
    steps:
      - download: current
        artifact: dockerImage

      - script: |
          echo "Cargando imagen TAR..."
          docker load -i image.tar
          echo "Re-etiquetando imagen para Docker Hub..."
          docker tag $(containerRegistry)/$(imageRepository):$(tag) \
                     docker.io/$(imageRepositoryDockerHub):$(tag)
        displayName: "Cargar y Tag Imagen para Docker Hub"

      - task: Docker@2
        displayName: "Push Imagen a Docker Hub"
        inputs:
          command: push
          repository: $(imageRepositoryDockerHub)
          containerRegistry: $(dockerRegistryServiceConnectionDockerHub)
          tags: |
            $(tag)
